[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbt-search-manager"
version = "0.1.0"
description = "Desktop utility to browse, install, and manage qBittorrent community search engines from the unofficial wiki list."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Glau Rossi" }]
keywords = ["qbittorrent", "pyside6", "search-plugins", "qt", "torrent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "PySide6>=6.6.0",
]

[project.scripts]
qbt-search-manager = "qbt_search_manager.__main__:main"

[project.urls]
Homepage = "https://github.com/glaurossi/qBittorrent-Search-Engine-Manager"
Repository = "https://github.com/glaurossi/qBittorrent-Search-Engine-Manager"
Issues = "https://github.com/glaurossi/qBittorrent-Search-Engine-Manager/issues"
Changelog = "https://github.com/glaurossi/qBittorrent-Search-Engine-Manager/releases"

[tool.setuptools.packages.find]
where = ["."]
include = ["qbt_search_manager*"]

[tool.setuptools.package-data]
qbt_search_manager = ["assets/icons/*.svg"]
